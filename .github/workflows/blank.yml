name: Executar PC Virtual

on:
  workflow_dispatch:

jobs:
  rodar-pc:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar a senha do Runner
        run: |
          echo "runner:uer5" | sudo chpasswd

      - name: Criar Arquivo pc_virtual.py
        run: |
          cat << 'EOF' > pc_virtual.py
          import sys

          class PCVirtual:
              def __init__(self):
                  self.memoria = [0] * 256
                  self.registradores = [0] * 4
                  self.pc = 0
                  self.rodando = True

              LOAD  = 0x01
              ADD   = 0x02
              PRINT = 0x03
              HALT  = 0x04

              def carregar_programa(self, programa):
                  for i, byte in enumerate(programa):
                      self.memoria[i] = byte

              def executar(self):
                  print("--- Inicializando PC Virtual no GitHub Actions ---")
                  while self.rodando and self.pc < len(self.memoria):
                      opcode = self.memoria[self.pc]
                      self.pc += 1

                      if opcode == self.LOAD:
                          reg = self.memoria[self.pc]
                          valor = self.memoria[self.pc + 1]
                          self.registradores[reg] = valor
                          self.pc += 2

                      elif opcode == self.ADD:
                          reg_destino = self.memoria[self.pc]
                          reg_origem = self.memoria[self.pc + 1]
                          self.registradores[reg_destino] += self.registradores[reg_origem]
                          self.pc += 2

                      elif opcode == self.PRINT:
                          reg = self.memoria[self.pc]
                          print(f"[SAÍDA DO PC] Registrador R{reg}: {self.registradores[reg]}")
                          self.pc += 1

                      elif opcode == self.HALT:
                          print("--- PC Virtual Desligado com Sucesso ---")
                          self.rodando = False
                      else:
                          print(f"Erro: Instrução desconhecida 0x{opcode:02X}")
                          self.rodando = False

          programa_exemplo = [
              PCVirtual.LOAD,  0, 10,
              PCVirtual.LOAD,  1, 5,
              PCVirtual.ADD,   0, 1,
              PCVirtual.PRINT, 0,
              PCVirtual.HALT
          ]

          if __name__ == "__main__":
              pc = PCVirtual()
              pc.carregar_programa(programa_exemplo)
              pc.executar()
          EOF

      - name: Executar o PC Virtual
        run: python pc_virtual.py

      - name: Iniciar Sessão Interativa SSH (IP e Acesso)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
